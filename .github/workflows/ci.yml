name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]
      - name: Lint
        run: python -m ruff check .
      - name: Shell syntax
        run: bash -n harborrl/platform/slime_train.sh scripts/*.sh
      - name: CPU contracts
        run: python -m pytest
      - name: Example contract smoke
        run: bash examples/native/cpu_contract_smoke.sh
      - name: Training dry run
        run: python -m harborrl.cli train --config examples/native/train_qwen_native.yaml --dry-run
      - name: Public tree audit
        run: bash scripts/audit_public_tree.sh

  documentation-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit documents in every new commit
        env:
          DOCUMENTATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/audit_public_tree.sh --history-base "$DOCUMENTATION_BASE"

  sandbox-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional runtime and practice
        run: python -m pip install -e '.[dev,sandbox]' -e practices/h_cluster
      - name: SDK contracts without allocation
        run: python scripts/sandbox_sdk_contract.py
      - name: Optional lifecycle and practice tests
        run: python -m pytest tests/harborrl/test_sandbox_cleanup.py practices/h_cluster/tests

  package:
    runs-on: ubuntu-latest
    needs: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/harborrl-wheel
          /tmp/harborrl-wheel/bin/pip install dist/*.whl
          /tmp/harborrl-wheel/bin/harborrl --help
      - uses: actions/upload-artifact@v4
        with:
          name: harborrl-dist
          path: dist/*
