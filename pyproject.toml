[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborrl"
version = "0.1.0"
description = "Harbor task integration and agentic RL training framework"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
harborrl = "harborrl.cli:main"

[project.optional-dependencies]
distill = [
  "torch>=2.5,<3",
  "transformers>=4.49,<5",
]

prm = [
  "torch>=2.4",
  "transformers==4.46.3",
]
sandbox = [
  "harbor==0.23.0; python_version >= '3.12'",
  "opensandbox==0.1.9; python_version >= '3.12'",
  "httpx>=0.27,<1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "httpx>=0.27,<1",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["harborrl*"]
exclude = ["runs*", ".venv*", "workspace*", "local*", "docs*", "tests*"]

[tool.setuptools.package-data]
"harborrl.platform" = ["*.sh"]
"harborrl.options" = ["resources/*.yaml"]
"harborrl.webui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
